name: EC2 Deploy

on:
  push:
    branches:
      - feature/commerce-jsy-order-test-refact
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build application jars
        run: |
          ./gradlew \
            :gateway:bootJar \
            :member:bootJar \
            :commerce:bootJar \
            :point:bootJar \
            :elastic-search:bootJar \
            -x test

      - name: Prepare deployment bundle
        run: |
          mkdir -p deploy/jars
          cp docker-compose.yml deploy/
          cp gateway/build/libs/*.jar deploy/jars/gateway.jar
          cp member/build/libs/*.jar deploy/jars/member.jar
          cp commerce/build/libs/*.jar deploy/jars/commerce.jar
          cp point/build/libs/*.jar deploy/jars/point.jar
          cp elastic-search/build/libs/*.jar deploy/jars/elastic-search.jar

      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy/*"
          target: "~/beadv2-deploy"
          strip_components: 1

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: APP_ENV
          script: |
            set -eu

            mkdir -p ~/beadv2-deploy/logs
            cd ~/beadv2-deploy

            printf '%s\n' "$APP_ENV" > .env

            if docker compose version >/dev/null 2>&1; then
              docker compose up -d
            else
              docker-compose up -d
            fi

            pkill -f 'gateway.jar' || true
            pkill -f 'member.jar' || true
            pkill -f 'commerce.jar' || true
            pkill -f 'point.jar' || true
            pkill -f 'elastic-search.jar' || true

            set -a
            . ./.env
            set +a

            nohup java -jar jars/gateway.jar > logs/gateway.log 2>&1 &
            nohup java -jar jars/member.jar > logs/member.log 2>&1 &
            nohup java -jar jars/commerce.jar > logs/commerce.log 2>&1 &
            nohup java -jar jars/point.jar > logs/point.log 2>&1 &
            nohup java -jar jars/elastic-search.jar > logs/elastic-search.log 2>&1 &

            sleep 20

            curl -fsS http://127.0.0.1:8000/actuator/health
