name: EC2 Deploy

on:
  push:
    branches:
      - feature/commerce-jsy-order-test-refact
      - feature/commerce-service-jsy-old-version
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build application jars
        run: |
          ./gradlew \
            :gateway:bootJar \
            :member:bootJar \
            :commerce:bootJar \
            :point:bootJar \
            :elastic-search:bootJar \
            :recommendation:bootJar \
            :batch:bootJar \
            -x test

      - name: Prepare deployment bundle
        run: |
          mkdir -p deploy/jars
          cp docker-compose.yml deploy/
          cp docker-compose.monitoring.yml deploy/
          cp Dockerfile deploy/
          cp -R docker deploy/
          cp -R monitoring deploy/
          cp gateway/build/libs/*.jar deploy/jars/gateway.jar
          cp member/build/libs/*.jar deploy/jars/member.jar
          cp commerce/build/libs/*.jar deploy/jars/commerce.jar
          cp point/build/libs/*.jar deploy/jars/point.jar
          cp elastic-search/build/libs/*.jar deploy/jars/elastic-search.jar
          cp recommendation/build/libs/*.jar deploy/jars/recommendation.jar
          cp batch/build/libs/*.jar deploy/jars/batch.jar

      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy/*"
          target: "~/beadv2-deploy"
          strip_components: 1
          debug: true

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: APP_ENV
          script: |
            set -eu

            mkdir -p ~/beadv2-deploy/logs
            cd ~/beadv2-deploy

            printf '%s\n' "$APP_ENV" > .env

            echo "Disk usage before cleanup"
            df -h
            docker system df || true

            # Remove stale build cache and dangling artifacts before infra startup.
            docker builder prune -af >/dev/null 2>&1 || true
            docker image prune -af --filter "until=168h" >/dev/null 2>&1 || true
            docker container prune -f >/dev/null 2>&1 || true

            echo "Disk usage after cleanup"
            df -h
            docker system df || true

            if ! docker image inspect elasticsearch-nori:8.18.8 >/dev/null 2>&1; then
              echo "Building elasticsearch-nori image..."
              docker build -t elasticsearch-nori:8.18.8 -f Dockerfile .
            fi

            if docker compose version >/dev/null 2>&1; then
              docker compose -f docker-compose.yml up -d
              docker compose -p beadv2-monitoring -f docker-compose.monitoring.yml up -d
            else
              docker-compose -f docker-compose.yml up -d
              docker rm -f beadv2-grafana beadv2-prometheus beadv2-loki beadv2-promtail >/dev/null 2>&1 || true
              docker-compose -p beadv2-monitoring -f docker-compose.monitoring.yml up -d
            fi

            stop_jar() {
              jar_name="$1"
              pids=$(pgrep -f "^java -jar jars/${jar_name}\$" || true)
              if [ -n "${pids:-}" ]; then
                echo "$pids" | xargs -r kill -TERM
                sleep 2
              fi
            }

            stop_jar gateway.jar
            stop_jar member.jar
            stop_jar commerce.jar
            stop_jar point.jar
            stop_jar elastic-search.jar
            stop_jar recommendation.jar

            set -a
            . ./.env
            set +a

            nohup env -i \
              PATH="$PATH" \
              HOME="$HOME" \
              SPRING_PROFILES_ACTIVE="$SPRING_PROFILES_ACTIVE" \
              JWT_SECRET="$JWT_SECRET" \
              JWT_ACCESS_TOKEN_VALIDITY_PERIOD="$JWT_ACCESS_TOKEN_VALIDITY_PERIOD" \
              JWT_REFRESH_TOKEN_VALIDITY_PERIOD="$JWT_REFRESH_TOKEN_VALIDITY_PERIOD" \
              SPRING_KAFKA_BOOTSTRAP_SERVERS="$SPRING_KAFKA_BOOTSTRAP_SERVERS" \
              REDIS_HOST="$REDIS_HOST" \
              REDIS_PORT="$REDIS_PORT" \
              SPRING_DATASOURCE_URL="$MEMBER_DATABASE_URL" \
              SPRING_DATASOURCE_USERNAME="$MEMBER_POSTGRES_USERNAME" \
              SPRING_DATASOURCE_PASSWORD="$MEMBER_POSTGRES_PASSWORD" \
              COMMERCE_SERVICE_URL="$COMMERCE_SERVICE_URL" \
              POINT_SERVICE_URL="$POINT_SERVICE_URL" \
              MEMBER_SMTP_EMAIL="$MEMBER_SMTP_EMAIL" \
              MEMBER_SMTP_PASSWORD="$MEMBER_SMTP_PASSWORD" \
              APP_OAUTH2_FRONTEND_REDIRECT_URL="${APP_OAUTH2_FRONTEND_REDIRECT_URL:-https://0982-project-fe.vercel.app}" \
              java -jar jars/member.jar > logs/member.log 2>&1 &

            nohup env -i \
              PATH="$PATH" \
              HOME="$HOME" \
              SPRING_PROFILES_ACTIVE="$SPRING_PROFILES_ACTIVE" \
              PRODUCT_DATABASE_P6SPY_URL="$PRODUCT_DATABASE_P6SPY_URL" \
              PRODUCT_DATABASE_USERNAME="$PRODUCT_DATABASE_USERNAME" \
              PRODUCT_DATABASE_PASSWORD="$PRODUCT_DATABASE_PASSWORD" \
              REDIS_HOST="$REDIS_HOST" \
              REDIS_PORT="$REDIS_PORT" \
              SPRING_KAFKA_BOOTSTRAP_SERVERS="$SPRING_KAFKA_BOOTSTRAP_SERVERS" \
              CLIENT_MEMBER="$CLIENT_MEMBER" \
              AWS_ACCESS_KEY="$AWS_ACCESS_KEY" \
              AWS_SECRET_KEY="$AWS_SECRET_KEY" \
              AWS_REGION="$AWS_REGION" \
              S3_BUCKET_NAME="$S3_BUCKET_NAME" \
              java -jar jars/commerce.jar > logs/commerce.log 2>&1 &

            nohup env -i \
              PATH="$PATH" \
              HOME="$HOME" \
              SPRING_PROFILES_ACTIVE="$SPRING_PROFILES_ACTIVE" \
              SPRING_DATASOURCE_URL="$SPRING_DATASOURCE_URL" \
              SPRING_DATASOURCE_USERNAME="$SPRING_DATASOURCE_USERNAME" \
              SPRING_DATASOURCE_PASSWORD="$SPRING_DATASOURCE_PASSWORD" \
              SPRING_KAFKA_BOOTSTRAP_SERVERS="$SPRING_KAFKA_BOOTSTRAP_SERVERS" \
              CLIENT_COMMERCE="$CLIENT_COMMERCE" \
              TOSS_SECRET_KEY="$TOSS_SECRET_KEY" \
              java -jar jars/point.jar > logs/point.log 2>&1 &

            nohup env -i \
              PATH="$PATH" \
              HOME="$HOME" \
              SPRING_PROFILES_ACTIVE="$SPRING_PROFILES_ACTIVE" \
              SPRING_KAFKA_BOOTSTRAP_SERVERS="$SPRING_KAFKA_BOOTSTRAP_SERVERS" \
              SPRING_ELASTICSEARCH_URIS="$SPRING_ELASTICSEARCH_URIS" \
              TOKEN_INTERNAL_SECRET="$TOKEN_INTERNAL_SECRET" \
              CLIENT_RECOMMENDATION="$CLIENT_RECOMMENDATION" \
              CLIENT_COMMERCE="$CLIENT_COMMERCE" \
              java -jar jars/elastic-search.jar > logs/elastic-search.log 2>&1 &

            nohup env -i \
              PATH="$PATH" \
              HOME="$HOME" \
              SPRING_PROFILES_ACTIVE="$SPRING_PROFILES_ACTIVE" \
              RECOMMENDATION_DATABASE_URL="$RECOMMENDATION_DATABASE_URL" \
              RECOMMENDATION_DATABASE_USERNAME="$RECOMMENDATION_DATABASE_USERNAME" \
              RECOMMENDATION_DATABASE_PASSWORD="$RECOMMENDATION_DATABASE_PASSWORD" \
              SPRING_KAFKA_BOOTSTRAP_SERVERS="$SPRING_KAFKA_BOOTSTRAP_SERVERS" \
              SPRING_ELASTICSEARCH_URIS="$SPRING_ELASTICSEARCH_URIS" \
              CLIENT_COMMERCE_URL="$CLIENT_COMMERCE" \
              OPENAI_API_KEY="$OPENAI_API_KEY" \
              OPENAI_EMBEDDING_MODEL="$OPENAI_EMBEDDING_MODEL" \
              java -jar jars/recommendation.jar > logs/recommendation.log 2>&1 &

            nohup env -i \
              PATH="$PATH" \
              HOME="$HOME" \
              SPRING_PROFILES_ACTIVE="$SPRING_PROFILES_ACTIVE" \
              JWT_SECRET="$JWT_SECRET" \
              REDIS_HOST="$REDIS_HOST" \
              REDIS_PORT="$REDIS_PORT" \
              SPRING_KAFKA_BOOTSTRAP_SERVERS="$SPRING_KAFKA_BOOTSTRAP_SERVERS" \
              SPRING_R2DBC_URL="$SPRING_R2DBC_URL" \
              SPRING_DATASOURCE_USERNAME="$SPRING_DATASOURCE_USERNAME" \
              SPRING_DATASOURCE_PASSWORD="$SPRING_DATASOURCE_PASSWORD" \
              MEMBER_SERVICE_URL="$MEMBER_SERVICE_URL" \
              COMMERCE_SERVICE_URL="$COMMERCE_SERVICE_URL" \
              POINT_SERVICE_URL="$POINT_SERVICE_URL" \
              SEARCH_SERVICE_URL="$SEARCH_SERVICE_URL" \
              RECOMMENDATION_SERVICE_URL="$RECOMMENDATION_SERVICE_URL" \
              FRONTEND_URL="${FRONTEND_URL:-https://0982-project-fe.vercel.app}" \
              java -jar jars/gateway.jar > logs/gateway.log 2>&1 &

            for i in $(seq 1 18); do
              if curl -fsS http://127.0.0.1:8000/actuator/health >/dev/null 2>&1; then
                curl -fsS http://127.0.0.1:8000/actuator/health
                exit 0
              fi
              sleep 5
            done

            echo "Gateway health check failed"
            tail -n 100 logs/gateway.log || true
            exit 1
